limit_req_zone $binary_remote_addr zone=cfcb_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cfcb_auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=cfcb_conn:10m;

upstream cfcb_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream cfcb_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name courierfraudcheckbd.com www.courierfraudcheckbd.com api.courierfraudcheckbd.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name courierfraudcheckbd.com www.courierfraudcheckbd.com;

    ssl_certificate /etc/letsencrypt/live/courierfraudcheckbd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/courierfraudcheckbd.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 25m;
    limit_conn cfcb_conn 40;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https:; connect-src 'self' https://api.courierfraudcheckbd.com; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;

    access_log /var/log/nginx/cfcb-frontend-access.log;
    error_log /var/log/nginx/cfcb-frontend-error.log warn;

    location /_next/static/ {
        proxy_pass http://cfcb_frontend;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://cfcb_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.courierfraudcheckbd.com;

    ssl_certificate /etc/letsencrypt/live/api.courierfraudcheckbd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.courierfraudcheckbd.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 25m;
    limit_conn cfcb_conn 40;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; connect-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

    access_log /var/log/nginx/cfcb-api-access.log;
    error_log /var/log/nginx/cfcb-api-error.log warn;

    location /api/v1/auth/login {
        limit_req zone=cfcb_auth burst=10 nodelay;
        proxy_pass http://cfcb_backend;
        include /etc/nginx/snippets/cfcb-proxy-headers.conf;
    }

    location /api/ {
        limit_req zone=cfcb_api burst=30 nodelay;
        proxy_pass http://cfcb_backend;
        include /etc/nginx/snippets/cfcb-proxy-headers.conf;
    }

    location /socket.io/ {
        proxy_pass http://cfcb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/snippets/cfcb-proxy-headers.conf;
    }
}
